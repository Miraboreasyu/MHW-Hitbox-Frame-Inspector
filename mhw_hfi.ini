; ============================================================================
;  MHW Hitbox & Frame Inspector — Default Configuration (MHW:I 15.23)
;  Place this file at: <MHW Root>\nativePC\plugins\mhw_hfi.ini
;  Tip: Save as UTF-8 when using Chinese / Japanese custom shoutout commands.
; ============================================================================

; Master switch (1 = enabled, 0 = disabled)
Enabled=1

; ---- Main Keyboard Hotkeys ----
KeyToggleVis=U
KeyToggleFreeze=I
KeyFreezeOthers=K
KeyPersistHitbox=J
KeyStepFrame=O
KeyCycleFilter=P
KeyToggleOverlay=\

; ---- General Behavior ----
; Start with collision visualization enabled automatically (0 = off, 1 = on)
StartVisOn=0
; Keep single-trigger hitboxes active & repeatable during World Freeze (1 = on, 0 = off)
KeepHitboxesActive=1
; Block in-game O / K / L / ; camera rotation keys outside text input (1 = on, 0 = off)
BlockCameraKeys=1
; Show compact top-left HUD status banner (1 = on, 0 = off)
ShowHudBanner=1

; ---- In-Game Chat & Radial Shoutout Triggers (Exact Match, Hot-Reloadable) ----
; Editing & saving this file takes effect on the next chat message or panel open (no restart needed).
; Leave a command empty or set it to NONE to disable that individual command.
ChatCommands=1
ChatCaseSensitive=0
ChatCmdVis=$draw_hitbox
ChatCmdFreeze=$full_freeze
ChatCmdWorldFreeze=$ThE_WoRLD!!!
ChatCmdStep=$step_frame
ChatCmdKeepHitbox=$keep_hitbox
ChatCmdPanel=$show_panel
ChatCmdOverlay=$show_overlay

; ---- Controller Navigation for the [P] Panel (Hot-Reloadable) ----
; 1 = enabled (D-Pad = Arrow Keys, A / Cross = Space), 0 = disabled
GamepadPanel=1

; ---- Visual Appearance ----
; Base wireframe thickness in pixels at 1080p (0.8 .. 8.0)
LineThickness=2.0
; Initial entity / monster / player line width scale (0.35 .. 3.00)
EntityLineScale=1.0
; Initial terrain / raw wireframe line width scale (0.35 .. 3.00)
SbcLineScale=1.0
; Global overlay opacity multiplier (0.1 .. 1.5)
OpacityScale=1.0
; Semi-transparent terrain surface opacity multiplier (0.1 .. 3.0)
SbcSurfaceOpacity=1.0
; HDR overlay luminance in nits (0 = auto match game HDR paper white, or 40 .. 1000)
HdrNits=0

; ---- Default Filter & Scene Settings ----
; Default category bitmask:
;   0x01=Pl Hurtbox, 0x02=Pl Hitbox, 0x04=Palico, 0x08=Em Hurtbox,
;   0x10=Em Hitbox,  0x20=Pushbox,   0x40=Map Entities, 0x80=Map Terrain
;   Presets: 0x1B=PL+EM COMBAT, 0x3F=PL+EM ONLY, 0xC0=MAP ONLY, 0xFF=ALL
CategoryMask=0x1B
; Default terrain mesh display radius in meters (15 / 25 / 45 / 80)
SbcRadiusMeters=25
; Hide monster mesh when visualization is on (0 = off, 1 = hidden)
StartHideMonster=0
; Hide map / stage mesh (0 = OFF, 1 = KEEP INTERACT, 2 = HIDE ALL MAP)
StartHideStage=0
; Pure 3D / canvas backdrop mode (0 = OFF, 1 = HIDE PL/VFX, 2 = HIDE ALL 3D, 3 = DIM 45%)
StartBackdrop=0
; Terrain display style (0 = SEMI 3D+RINGS, 1 = OPAQUE 3D+RING, 2 = OPAQUE 3D ONLY,
;                        3 = SEMI+RINGS ON, 4 = SEMI 3D ONLY, 5 = RAW WIREFRAME)
DepthGuideMode=0
; Terrain collision tier (0 = LOW ONLY, 1 = LOW + HIGH, 2 = HIGH ONLY)
SbcMeshTier=1
; Special / non-solid terrain layer style (0 = OFF, 1 = GHOST, 2 = LIGHT, 3 = MED, 4 = VIVID, 5 = OPAQUE)
SpecialSbcStyle=2
; Monster part partition mode (0 = OFF, 1 = HITZONE, 2 = CLUTCH)
EmPartMode=0
; Unselected monster part display style (0 = HIDE, 1 = GHOST OUTLINE)
EmUnselectedStyle=0
; 3D floating part label style (0 = PHYS+ELEM+EXT, 1 = PHYS+EXTRACT, 2 = ID+EXTRACT, 3 = OFF)
EmPartLabels=0
